version: '3.8'

services:
  web:
    # Docker будет брать значения из .env файла, который мы создадим при деплое
    image: ${DOCKER_USER}/restapp:${IMAGE_TAG}
    container_name: rest_app
    # Удалите или закомментируйте блоки build, так как на сервере они не нужны
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16.3
    container_name: postgres_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: