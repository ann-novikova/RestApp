{% extends 'base.html' %}

{% block content %}
<style>
    .hero-section {
        height: 90vh;
        background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                          url('https://i.pinimg.com/originals/77/0d/bf/770dbfc8ee02ab175d3a4f69efb7722c.jpg');
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;

        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .form-control {
        background: transparent;
        border: none;
        border-bottom: 1px solid #444;
        border-radius: 0;
        color: #fff;
        padding: 15px 5px;
    }
    .form-control:focus {
        background: transparent;
        color: #fff;
        border-color: var(--gold);
        box-shadow: none;
    }
</style>

<!-- Hero Section -->
<section class="hero-section">
    <div class="container">
        <h1 class="display-1 mb-2 italic">NVK</h1>
        <p class="lead mb-5 text-light uppercase tracking-widest" style="letter-spacing: 8px;">
            HAUTE CUISINE by Novikov Family
        </p>
        <p class="lead mb-5 text-light uppercase tracking-widest" style="letter-spacing: 5px;">{{ info.name }}</p>
        <a href="{% url 'bookings:check_availability' %}" class="btn btn-gold">Забронировать визит</a>
    </div>
</section>

<!-- Welcome -->
<section class="py-5 my-5">
    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h2 class="display-5 mb-4 italic">Добро пожаловать</h2>
                <p class="text-muted leading-relaxed" style="font-size: 1.1rem; line-height: 2;">
                    {{ info.description }}
                </p>
            </div>
        </div>
    </div>
</section>

<!-- Contact Form -->
<section id="contact" class="py-5 bg-black">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 border p-5 border-secondary">
                <h2 class="text-center text-gold mb-5 uppercase tracking-widest">Обратная связь</h2>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-4">
                        {{ field }}
                    </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-gold w-100 mt-4">Отправить запрос</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
