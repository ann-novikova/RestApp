name: RestApp CI/CD Pipeline

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.DATABASE_NAME }}
          POSTGRES_USER: ${{ env.DATABASE_USER }}
          POSTGRES_PASSWORD: ${{ env.DATABASE_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      DATABASE_USER: ${{ secrets.DATABASE_USER }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
      DATABASE_PORT: ${{ secrets.DATABASE_PORT }}

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/restapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/restapp:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "mkdir -p ~/restapp_project"
          scp -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:~/restapp_project/docker-compose.yml
          
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd ~/restapp_project
            
            # 1. Создаем .env (добавляем кавычки для безопасности)
            echo "DATABASE_NAME='${{ secrets.DATABASE_NAME }}'" > .env
            echo "DATABASE_USER='${{ secrets.DATABASE_USER }}'" >> .env
            echo "DATABASE_PASSWORD='${{ secrets.DATABASE_PASSWORD }}'" >> .env
            echo "DATABASE_HOST=db" >> .env
            echo "DATABASE_PORT=5432" >> .env
            echo "SECRET_KEY='${{ secrets.SECRET_KEY }}'" >> .env
            echo "DEBUG=False" >> .env
            echo "ALLOWED_HOSTS='${{ secrets.SERVER_IP }},localhost,127.0.0.1'" >> .env
            echo "DOCKER_USER=${{ secrets.DOCKER_HUB_USERNAME }}" >> .env
            echo "IMAGE_TAG=${{ github.sha }}" >> .env
            
            # 2. ПОЛНАЯ ОЧИСТКА (Включая тома, если база не стартует)
            docker compose down -v || true
            docker network prune -f || true
            
            # 3. Запуск
            docker compose pull
            docker compose up -d
            
            # 4. Проверка, почему падает база (ЛОГИ)
            echo "Ожидание запуска базы..."
            sleep 15
            
            echo "--- ЛОГИ БАЗЫ ДАННЫХ (Если тут ошибка, проверьте секреты) ---"
            docker compose logs db
            
            echo "--- СТАТУС ---"
            docker compose ps
            
            # 5. Миграции
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput --clear
          EOF
