{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card bg-dark border-secondary p-4">
            <h2 class="text-gold text-center mb-4">РЕГИСТРАЦИЯ</h2>
            <form id="regForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="small text-gold">ИМЯ</label>
                        <input type="text" id="first_name" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="small text-gold">ФАМИЛИЯ</label>
                        <input type="text" id="last_name" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="small text-gold">EMAIL*</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="small text-gold">ТЕЛЕФОН</label>
                    <input type="text" id="phone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="small text-gold">ПАРОЛЬ*</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-gold w-100 mt-3">Создать аккаунт</button>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/register.js' %}"></script>
{% endblock %}
