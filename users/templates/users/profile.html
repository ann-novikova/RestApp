{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="p-4 p-md-5"
                 style="background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h2 style="color: #d4af37; font-style: italic; margin-bottom: 0;">Личный Кабинет</h2>
                        <p style="color: #6c757d; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;">
                            NVK Panoramic Guest</p>
                    </div>
                    <div id="profile-actions">
                        <button onclick="toggleEdit(true)"
                                class="btn btn-sm px-4"
                                style="color: #d4af37; border: 1px solid #d4af37; background: transparent;">
                            РЕДАКТИРОВАТЬ
                        </button>
                    </div>
                    <div id="edit-actions" class="d-none">
                        <button onclick="toggleEdit(false)"
                                class="btn btn-link text-muted btn-sm text-decoration-none me-3">ОТМЕНА
                        </button>
                        <button onclick="saveProfile()" class="btn btn-sm px-4"
                                style="background-color: #d4af37; color: #000; border: none; font-weight: bold;">
                            СОХРАНИТЬ
                        </button>
                    </div>
                </div>

                <form id="profile-form">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label style="color: #d4af37; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Имя</label>
                            <input type="text" id="user-first-name" class="form-control"
                                   style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(212,175,55,0.2); border-radius: 0;"
                                   value="..." disabled>
                        </div>
                        <div class="col-md-6">
                            <label style="color: #d4af37; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Фамилия</label>
                            <input type="text" id="user-last-name" class="form-control"
                                   style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(212,175,55,0.2); border-radius: 0;"
                                   value="..." disabled>
                        </div>
                        <div class="col-md-6">
                            <label style="color: #d4af37; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Телефон</label>
                            <input type="tel" id="user-phone" class="form-control"
                                   style="background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(212,175,55,0.2); border-radius: 0;"
                                   value="..." disabled>
                        </div>
                        <div class="col-md-12">
                            <label style="color: #d4af37; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 8px; display: block;">Email</label>
                            <input type="email" id="user-email" class="form-control"
                                   style="background: transparent; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 0;"
                                   value="..." disabled>
                        </div>
                    </div>
                </form>

                <hr style="border-color: rgba(212, 175, 55, 0.2); margin: 3rem 0;">

                <h4 style="color: #d4af37; font-weight: 300; margin-bottom: 1.5rem;">ИСТОРИЯ БРОНИРОВАНИЙ</h4>
                <div id="bookings-container">
                </div>
            </div>

        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/profile.js' %}"></script>
{% endblock %}
