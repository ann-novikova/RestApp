{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card bg-dark border-secondary p-4 shadow-lg">
            <h2 class="text-gold text-center mb-4 fst-italic">ВХОД</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="small text-gold tracking-widest">EMAIL</label>
                    <input type="email" id="email" class="form-control bg-transparent text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="small text-gold tracking-widest">ПАРОЛЬ</label>
                    <input type="password" id="password" class="form-control bg-transparent text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-gold w-100 mt-3 py-2 fw-bold">ВОЙТИ</button>
            </form>
            <div id="message" class="mt-3 text-danger small text-center"></div>
        </div>
    </div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
