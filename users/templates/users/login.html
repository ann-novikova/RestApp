{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4 card bg-dark border-secondary p-4">
            <h2 class="text-gold text-center mb-4">ВХОД</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="small text-gold">EMAIL</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="small text-gold">ПАРОЛЬ</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-gold w-100 mt-3">Войти</button>
            </form>
            <div id="message" class="mt-3 text-danger small text-center"></div>
        </div>
    </div>
</div>

<script>
// 1. Функция для получения CSRF-токена
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 2. Обработчик формы (теперь асинхронный)
document.getElementById('loginForm').onsubmit = async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch("/users/api/token/", { // Проверьте этот URL в urls.py
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        if (response.ok) {
            const data = await response.json();

            // Сохраняем реальные токены в память браузера
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);

            alert("Вход выполнен успешно!");
            window.location.href = "/"; // Перенаправляем на главную
        } else {
            const errorData = await response.json();
            alert("Ошибка: " + (errorData.detail || "Неверный логин или пароль"));
        }
    } catch (err) {
        console.error("Ошибка сети:", err);
        alert("Не удалось связаться с сервером");
    }
};
</script>
{% endblock %}
